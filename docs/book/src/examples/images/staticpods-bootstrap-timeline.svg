<rect width='760' height='664' fill='#ffffff'/>
<text x='24' y='30' text-anchor='start' font-size='15' font-weight='600' fill='#111827'>Pods bound before the mirror pods exist are rejected with OutOfcpu</text>
<rect x='16' y='284' width='728' height='308' fill='#fef3c7'/>
<rect x='42' y='52' width='176' height='36' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><path d='M130 88V110M130 150V488M130 544V610' stroke='#d1d5db' stroke-width='1.25'/><text x='130' y='75' text-anchor='middle' font-size='13' font-weight='600' fill='#111827'>Kubelet (new node)</text>
