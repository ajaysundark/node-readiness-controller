<rect x='542' y='52' width='176' height='36' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><line x1='630' y1='88' x2='630' y2='610' stroke='#d1d5db' stroke-width='1.25'/><text x='630' y='75' text-anchor='middle' font-size='13' font-weight='600' fill='#111827'>Scheduler</text>
<rect x='20' y='110' width='220' height='40' rx='8' fill='#ffffff' stroke='#6b7280' stroke-width='1.25'/><text x='130' y='134' text-anchor='middle' font-size='13' font-weight='normal' fill='#111827'>Starts static pods from disk</text>
<path d='M130 182H377' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='255' y='174' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Register Node</text>
<path d='M130 234H377' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#seq-arrow)'/><text x='255' y='226' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Mirror pod create skipped</text><text x='255' y='252' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#6b7280'>node informer not synced yet</text>
<path d='M130 300H377' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='255' y='292' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Node Ready (CNI up)</text>
<path d='M380 352H627' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='505' y='344' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Node is Ready and empty</text>
<path d='M630 404H383' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='505' y='396' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Bind workload pods to fill it</text>
<path d='M380 456H133' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='255' y='448' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Workload pods arrive</text>
<rect x='20' y='488' width='220' height='56' rx='8' fill='#dc2626' fill-opacity='0.12' stroke='#dc2626' stroke-width='2'/><text x='130' y='511' text-anchor='middle' font-size='13' font-weight='600' fill='#111827'>Admission rejects pod</text><text x='130' y='530' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>static pods + pod exceed CPU</text>
<path d='M130 580H377' fill='none' stroke='#6b7280' stroke-width='1.25' marker-end='url(#seq-arrow)'/><text x='255' y='572' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>Mirror pod created (resync)</text><text x='392' y='584' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>static pods counted, too late</text>
