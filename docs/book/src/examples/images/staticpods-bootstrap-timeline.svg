<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 664' width='760' height='664' role='img' aria-label='Pods bound before the mirror pods exist are rejected with OutOfcpu' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13'>
