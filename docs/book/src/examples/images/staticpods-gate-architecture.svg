<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 500' width='760' height='500' role='img' aria-label='The taint holds the node until its mirror pods are in the API server' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13'>
<defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs>
<rect width='760' height='500' fill='#ffffff'/>
<text x='24' y='30' text-anchor='start' font-size='15' font-weight='600' fill='#111827'>The taint holds the node until its mirror pods are in the API server</text>
<rect x='24' y='52' width='712' height='136' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25' stroke-dasharray='6 4'/><text x='40' y='76' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>New node</text>
<rect x='432' y='60' width='288' height='26' rx='8' fill='#2563eb' fill-opacity='0.12' stroke='#2563eb' stroke-width='2'/><text x='576' y='77' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#111827'>taint: readiness.k8s.io/StaticPodsMirrored</text>
<rect x='40' y='100' width='320' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='56' y='124' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>Kubelet</text><text x='56' y='140' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>runs static pods from its manifests</text><text x='56' y='156' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>registers the Node with the taint</text>
<rect x='400' y='100' width='320' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='416' y='124' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>Bootstrap check (DaemonSet)</text><text x='416' y='140' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>init: reads every manifest, waits for</text><text x='416' y='156' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>its mirror pod, posts once, then pause</text>
<rect x='200' y='260' width='360' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='216' y='284' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>API server</text><text x='216' y='300' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>Node: taint + readiness condition</text><text x='216' y='316' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>Mirror pods &lt;name&gt;-&lt;node&gt;</text>
<rect x='40' y='404' width='320' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='56' y='428' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>Node Readiness Controller</text><text x='56' y='444' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>rule static-pods-mirrored, bootstrap-only</text><text x='56' y='460' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>removes the taint once, then stops</text>
<rect x='400' y='404' width='320' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='416' y='428' text-anchor='start' font-size='13' font-weight='600' fill='#111827'>Scheduler</text><text x='416' y='444' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>binds workloads only after the taint</text><text x='416' y='460' text-anchor='start' font-size='11.5' font-weight='normal' fill='#111827'>is gone, static pods already counted</text>
<g fill='none' stroke='#6b7280' stroke-width='1.25'><path d='M360 136H397' marker-end='url(#arch-arrow)'/><path d='M240 172V257' marker-end='url(#arch-arrow)'/><path d='M520 175V257' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M280 335V401' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M480 335V401' marker-start='url(#arch-arrow)'/></g>
<text x='248' y='218' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>1 register (tainted)</text><text x='248' y='234' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>2 create mirror pod</text><text x='528' y='218' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>3 look up mirror pods</text><text x='528' y='234' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>4 write Node condition</text><text x='288' y='372' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>5 watch Node, remove taint</text><text x='488' y='372' text-anchor='start' font-size='11.5' font-weight='normal' fill='#6b7280'>6 watch, then bind</text>
</svg>